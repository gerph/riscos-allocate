---
# Publish the PRM-in-XML documentation to GitHub Pages in the RISC OS 3 PRM style.
# Pages must be enabled with the source set to 'GitHub Actions'.

name: Documentation

on:
  push:
    branches: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PrinceXML (http://www.princexml.com/) requires a licence. The non-commercial
      # licence may be used for documents that carry no advertising, are free to
      # everyone, and are published on a free site without advertising, provided
      # that a link to the PrinceXML site is given (the landing page has one).
      # See https://www.princexml.com/purchase/license_faq/ for details.
      - name: Build PRM-in-XML documentation and PDFs in RISC OS 3 PRM style
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: prminxml/riscos-allocate.xml prminxml/allocateformat.xml
          output: site
          style: prm
          css-variant: large-bullets
          pdf-generator: prince

      - name: Build the landing page
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: prminxml/landing.xml
          output: site
          style: prm
          css-variant: large-bullets

      - name: Assemble the site
        run: |
          mv site/landing.html site/index.html
          rm -f site/landing.xml
          # References to other files get '.html' appended, which is wrong for the PDFs.
          sed -i -E 's/\.pdf\.html#link_pdf/.pdf/g' site/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
